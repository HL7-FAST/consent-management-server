<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the FAST Consent Subscriptions Tab -->

	<p:tab title="Subscriptions" id="subscriptionsTab" cache="false">

		<p:panelGrid id="subscriptionsTabPanel1" columns="1" border="0"
			cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
			<h:outputText value="Subscriptions"
				style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;" />
			<h:outputText value="TODO - Automate background process; Log outbound notifications."
				style="padding:0px;font-style:italic;font-weight;font-size:12px;" />
		</p:panelGrid>

		<p:tabView id="subscriptionsTabView" widgetVar="subscriptionsTabView" cache="false">

			<p:ajax event="tabChange" listener="#{controller.onTabChange}"
				update=":tabView:subscriptionsTabView:createSubscriptionForm,:tabView:subscriptionsTabView:updateSubscriptionForm,:tabView:subscriptionsTabView:subscriptionClientForm,:tabView:subscriptionsTabView:subscriptionHandshakeForm" />

			<ui:include src="/WEB-INF/views/subscriptions/createSubscription.xhtml" />
			<ui:include src="/WEB-INF/views/subscriptions/updateSubscription.xhtml" />
			<ui:include src="/WEB-INF/views/subscriptions/subscriptionsClient.xhtml" />
			<ui:include src="/WEB-INF/views/subscriptions/subscriptionHandshake.xhtml" />

		</p:tabView>
	</p:tab>

</ui:composition>
