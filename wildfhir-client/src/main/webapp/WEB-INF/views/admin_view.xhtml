<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the FAST Consent Admin Tab -->

	<p:tab title="Admin" id="adminTab" cache="false">
		<p:tabView id="adminTabView" widgetVar="adminTabView" cache="false">

			<p:ajax event="tabChange" listener="#{controller.onTabChange}"
				update=":tabView:adminTabView:initializeClientForm,:tabView:adminTabView:serversForm" />

			<ui:include src="/WEB-INF/views/admin/servers.xhtml" />
			<ui:include src="/WEB-INF/views/admin/initialize_client.xhtml" />

		</p:tabView>
	</p:tab>

</ui:composition>
