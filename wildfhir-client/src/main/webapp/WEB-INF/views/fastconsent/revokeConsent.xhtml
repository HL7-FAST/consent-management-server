<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the FAST Consent $revokeConsent Tab -->

	<p:tab title="$revokeConsent" id="revokeConsentTab" cache="false">

		<h:form id="revokeConsentForm" prependId="false" style="width:100%;border:none;">
			<p:panelGrid id="revokeConsentPanel1" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
				<p:messages id="revokeConsentMessages" />
				<h:outputText value="Revoke Consent"
					style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;" />
				<h:outputText value="This operation is used to revoke a consent with a consent administration service."
					style="padding:0px;font-style:italic;font-size:12px;" />
				<h:outputText value="The parameters are a reference to the Consent resource along with optional documentation in the form of a DocumentReference (for PDF or other forms) or a QuestionnaireResponse."
					style="padding:0px;font-style:italic;font-size:12px;" />
			</p:panelGrid>

			<hr></hr>

			<p:panelGrid id="revokeConsentPanel2" layout="tabular" columns="2" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
				<h:outputText value="Format Type (Default JSON): * " />
				<p:selectOneMenu required="false" label="Select Format Type" value="#{context.selectedFormatType}" maxlength="10" style="width:80px;text-align:left;padding-right:30px;">
					<f:selectItems value="#{context.formatTypes}" var="formatType" itemLabel="#{formatType}         " itemValue="#{formatType}" />
				</p:selectOneMenu>

				<h:outputText value="Select Consent Mgmt Server: * " />
				<p:selectOneMenu required="true" label="Select Consent Mgmt Server" value="#{context.selectedServerURL}" maxlength="255" style="width:240px;text-align:left;padding-right:30px;">
					<f:selectItem itemValue="#{null}" itemLabel="-- Select Consent Mgmt Server --         " noSelectionOption="true" />
					<f:selectItems value="#{context.availableServers}" var="server" itemLabel="#{server.name.trim()}         " itemValue="#{server.basePath}" />
				</p:selectOneMenu>
			</p:panelGrid>

			<p:panel id="revokeConsentResultsPanel" visible="true"
				widgetVar="revokeConsentResultsPanel" toggleable="true" closable="true"
				toggleSpeed="500" closeSpeed="500">

				<p:toolbar>
					<f:facet name="right">
						<p:commandButton value="Send Request" icon="ui-icon-document"
							actionListener="#{controller.processRevokeConsent}"
							oncomplete="PF('revokeConsentTabView').select(2)"
							update=":tabView:fastconsentTabView:revokeConsentForm">
						</p:commandButton>
					</f:facet>
				</p:toolbar>

				<p:tabView id="revokeConsentTabView" widgetVar="revokeConsentTabView" dynamic="true" cache="false">
					<p:tab title="Consent" id="revokeConsentTab0">
						<p:panelGrid id="revokeConsentTabPanel0" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
							<h:outputText value="The $revokeConsent Parameters will be constructed from the selections. The patient reference parameter will be populated from the Consent patient reference. A fictitious DocumentReference resource will be generated for the supporting document parameter."
								style="padding:0px;font-style:italic;font-weight;font-size:12px;" />
						</p:panelGrid>

						<p:panelGrid id="revokeConsentTabPanel1" layout="tabular" columns="2" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
							<h:outputText value="Select Consent *" />
							<p:selectOneMenu required="true" label="Select Consent" value="#{context.selectedConsentId}" maxlength="255" style="width:300px;text-align:left;padding-right:30px;">
								<f:selectItem itemValue="#{null}" itemLabel="-- Select Consent --         " noSelectionOption="true" />
								<f:selectItems value="#{context.clientConsents}" var="con" itemLabel="#{con.description.trim()}         " itemValue="#{con.id}" />
							</p:selectOneMenu>
						</p:panelGrid>
					</p:tab>

					<p:tab title="Parameters" id="revokeConsentTab1">
						<h:inputTextarea value="#{context.resourceString}" cols="80" rows="24" />
					</p:tab>

					<p:tab title="Results" id="revokeConsentResultsTab">
						<h:outputText id="lblrevokeConsentResults" escape="true"
							value="#{context.responseString}"
							styleClass="whiteSpaceClass" />
					</p:tab>
				</p:tabView>
			</p:panel>

		</h:form>
	</p:tab>

</ui:composition>
