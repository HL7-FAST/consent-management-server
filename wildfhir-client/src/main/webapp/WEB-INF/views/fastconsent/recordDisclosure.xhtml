<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the FAST Consent $recordDisclosure Tab -->

	<p:tab title="$recordDisclosure" id="recordDisclosureTab" cache="false">

		<h:form id="recordDisclosureForm" prependId="false" style="width:100%;border:none;">
			<p:panelGrid id="recordDisclosurePanel1" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
				<p:messages id="recordDisclosureMessages" />
				<h:outputText value="Record Disclosure"
					style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;" />
				<h:outputText value="This operation is used to record a disclosure based on a given consent for a given patient with a consent administration service."
					style="padding:0px;font-style:italic;font-size:12px;" />
				<h:outputText value="The parameters are a Consent AuditEvent and a reference to the Consent resource."
					style="padding:0px;font-style:italic;font-size:12px;" />
			</p:panelGrid>

			<hr></hr>

			<p:panelGrid id="recordDisclosurePanel2" layout="tabular" columns="2" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
				<h:outputText value="Format Type (Default JSON): * " />
				<p:selectOneMenu required="false" label="Select Format Type" value="#{context.selectedFormatType}" maxlength="10" style="width:80px;text-align:left;padding-right:30px;">
					<f:selectItems value="#{context.formatTypes}" var="formatType" itemLabel="#{formatType}         " itemValue="#{formatType}" />
				</p:selectOneMenu>

				<h:outputText value="Select Consent Mgmt Server: * " />
				<p:selectOneMenu required="true" label="Select Consent Mgmt Server" value="#{context.selectedServerURL}" maxlength="255" style="width:240px;text-align:left;padding-right:30px;">
					<f:selectItem itemValue="#{null}" itemLabel="-- Select Consent Mgmt Server --         " noSelectionOption="true" />
					<f:selectItems value="#{context.availableServers}" var="server" itemLabel="#{server.name.trim()}         " itemValue="#{server.basePath}" />
				</p:selectOneMenu>
			</p:panelGrid>

			<p:panel id="recordDisclosureResultsPanel" visible="true"
				widgetVar="recordDisclosureResultsPanel" toggleable="true" closable="true"
				toggleSpeed="500" closeSpeed="500">

				<p:toolbar>
					<f:facet name="right">
						<p:commandButton value="Send Request" icon="ui-icon-document"
							actionListener="#{controller.processRecordDisclosure}"
							oncomplete="PF('recordDisclosureTabView').select(2)"
							update=":tabView:fastconsentTabView:recordDisclosureForm">
						</p:commandButton>
					</f:facet>
				</p:toolbar>

				<p:tabView id="recordDisclosureTabView" widgetVar="recordDisclosureTabView">
					<p:tab title="Consent" id="recordDisclosureTab0">
						<p:panelGrid id="recordDisclosureTabPanel0" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
							<h:outputText value="The $record-disclosure Parameters will be constructed from the selections. A fictitious AuditEvent resource will be generated for the selected Patient Consent and entered data."
								style="padding:0px;font-style:italic;font-weight;font-size:12px;" />
						</p:panelGrid>

						<p:panelGrid id="recordDisclosureTabPanel1" layout="tabular" columns="2" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
							<h:outputText value="Select Patient *" />
							<p:selectOneMenu required="true" label="Select Patient/Grantor" value="#{context.selectedPatientId}" maxlength="255" style="width:300px;text-align:left;padding-right:30px;">
								<f:selectItem itemValue="#{null}" itemLabel="-- Select Patient/Grantor --         " noSelectionOption="true" />
								<f:selectItems value="#{context.clientPatients}" var="pat" itemLabel="#{pat.description.trim()}         " itemValue="#{pat.id}" />
								<p:ajax update="recordDisclosureConsentDropdown" listener="#{controller.handleRecordDisclosurePatientChange}" />
							</p:selectOneMenu>

							<h:outputText value="Select Consent *" />
							<p:selectOneMenu id="recordDisclosureConsentDropdown" required="true" label="Select Consent" value="#{context.selectedPatientConsentId}" maxlength="255" style="width:300px;text-align:left;padding-right:30px;">
								<f:selectItem itemValue="#{null}" itemLabel="-- Select Consent --         " noSelectionOption="true" />
								<f:selectItems value="#{context.clientPatientConsents}" var="con" itemLabel="#{con.description.trim()}         " itemValue="#{con.id}" />
							</p:selectOneMenu>

							<h:outputText value="Select FHIR Interaction *" />
							<p:selectOneMenu required="true" label="Select FHIR Interaction" value="#{context.selectedFhirInteraction}" maxlength="255" style="width:180px;text-align:left;padding-right:30px;">
								<f:selectItem itemValue="#{null}" itemLabel="-- FHIR Interaction --         " noSelectionOption="true" />
								<f:selectItems value="#{context.fhirInteractions}" var="fi" itemLabel="#{fi}         " itemValue="#{fi}" />
							</p:selectOneMenu>

							<h:outputText value="Start Date (Optional)" />
							<p:datePicker id="recordDisclosureStartDate" value="#{context.startDate}" showButtonBar="true" />

							<h:outputText value="End Date (Optional)" />
							<p:datePicker id="recordDisclosureEndDate" value="#{context.endDate}" showButtonBar="true" />
						</p:panelGrid>
					</p:tab>

					<p:tab title="Parameters" id="recordDisclosureTab1">
						<h:inputTextarea value="#{context.resourceString}" cols="80" rows="24" />
					</p:tab>

					<p:tab title="Results" id="recordDisclosureResultsTab">
						<h:outputText id="lblrecordDisclosureResults" escape="true"
							value="#{context.responseString}"
							styleClass="whiteSpaceClass" />
					</p:tab>
				</p:tabView>
			</p:panel>

		</h:form>
	</p:tab>

</ui:composition>
