<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the FAST Consent Initialize Client Tab -->

	<p:tab title="Initialize Client" id="initializeClientTab" cache="false">

		<h:form id="initializeClientForm" prependId="false" style="width:100%;border:none;">
			<p:panelGrid id="fileConsentPanel1" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
				<p:messages for="initializeClientForm" />
				<h:outputText value="Initialize Client - Purge and Re-load Client Resources"
					style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;" />
				<h:outputText value="WARNING - This will delete all client resources and re-populate the default client test data"
					style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;color:#8B4000" />
			</p:panelGrid>

			<hr></hr>

			<p:panelGrid id="initializeClientPanel" columns="1" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
				<p:commandButton value="Initialize" icon="ui-icon-disk" actionListener="#{controller.initializeClient}" update=":tabView:adminTabView:initializeClientForm" >
				</p:commandButton>
			</p:panelGrid>

			<p:panel id="initializeClientResultsPanel" visible="true" widgetVar="initializeClientResultsPanel">
				<h:outputText id="lblInitializeClientResults" escape="true"
					value="#{context.responseString}"
					styleClass="whiteSpaceClass" />
			</p:panel>
		</h:form>
	</p:tab>

</ui:composition>
