<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the FAST Consent Create Subscription Tab -->

	<p:tab title="Create" id="createSubscriptionTab" cache="false">

		<h:form id="createSubscriptionForm" prependId="false" style="width:100%;border:none;">
			<p:panelGrid id="createSubscriptionPanel1" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
				<p:messages id="createSubscriptionMessages" />
				<h:outputText value="Subscription Create"
					style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;" />
				<h:outputText value="This interface is used to define and send an active Subscription create request to a consent administration service."
					style="padding:0px;font-style:italic;font-size:12px;" />
				<h:outputText value="The Subscription criteria must conform with the FAST Consent SubscriptionTopic allowed search parameters."
					style="padding:0px;font-style:italic;font-size:12px;" />
			</p:panelGrid>

			<hr></hr>

			<p:panelGrid id="createSubscriptionPanel2" columns="2" layout="tabular" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
				<h:outputText value="Format Type (Default JSON): * " />
				<p:selectOneMenu required="false" label="Select Format Type" value="#{context.selectedFormatType}" maxlength="10" style="width:80px;text-align:left;padding-right:30px;">
					<f:selectItems value="#{context.formatTypes}" var="formatType" itemLabel="#{formatType}         " itemValue="#{formatType}" />
				</p:selectOneMenu>

				<h:outputText value="Select Consent Mgmt Server: * " />
				<p:selectOneMenu required="true" label="Select Consent Mgmt Server" value="#{context.selectedServerURL}" maxlength="255" style="width:240px;text-align:left;padding-right:30px;">
					<f:selectItem itemValue="#{null}" itemLabel="-- Select Consent Mgmt Server --         " noSelectionOption="true" />
					<f:selectItems value="#{context.availableServers}" var="server" itemLabel="#{server.name.trim()}         " itemValue="#{server.basePath}" />
				</p:selectOneMenu>
			</p:panelGrid>

			<p:panel id="createSubscriptionResultsPanel" visible="true"
				widgetVar="createSubscriptionResultsPanel" toggleable="true" closable="true"
				toggleSpeed="500" closeSpeed="500">

				<p:toolbar>
					<f:facet name="right">
						<p:commandButton value="Send Request" icon="ui-icon-document"
							actionListener="#{controller.processCreateSubscription}"
							oncomplete="PF('createSubscriptionTabView').select(2)"
							update=":tabView:subscriptionsTabView:createSubscriptionForm">
						</p:commandButton>
					</f:facet>
				</p:toolbar>

				<p:tabView id="createSubscriptionTabView" widgetVar="createSubscriptionTabView">
					<p:tab title="Subscription" id="createSubscriptionTab0">
						<p:panelGrid id="createSubscriptionTabPanel0" columns="1" border="0" cellpadding="0" cellspacing="0" styleClass="borderlessGridPanel">
							<h:outputText value="The Subscription resource will be constructed from the selections. The default topic is the FASTConsentSubscriptionTopic. The default channel type is 'rest-hook'."
								style="padding:0px;font-style:italic;font-weight;font-size:12px;" />
						</p:panelGrid>

						<p:panelGrid id="createSubscriptionTabPanel1" layout="tabular" columns="2" border="0" cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
							<h:outputText value="Select SubscriptionTopic *" />
							<p:selectOneMenu id="createSubscriptionTopicDropdown" required="true" label="Select SubscriptionTopic" value="#{context.selectedSubscriptionTopic}" maxlength="255" style="width:360px;text-align:left;padding-right:30px;">
								<f:selectItem itemValue="#{null}" itemLabel="-- Select SubscriptionTopic --         " noSelectionOption="true" />
								<f:selectItems value="#{context.listSubscriptionTopic}" var="topic" itemLabel="#{topic.label.trim()}         " itemValue="#{topic.key}" />
								<p:ajax update="createSubscriptionCriteria" listener="#{controller.handleCreateSubscriptionTopicChange}" />
							</p:selectOneMenu>

							<h:outputText value="Reason (description) * " />
							<h:inputTextarea id="createSubscriptionReason" value="#{context.subscriptionReason}" cols="50" rows="2" required="true" requiredMessage="Please enter the reason why this subscription was created" />

							<h:outputText value="Criteria (search params) * " />
							<h:inputTextarea id="createSubscriptionCriteria" value="#{context.subscriptionCriteria}" cols="50" rows="2" required="true" requiredMessage="Please enter the filtering criteria (search parameters) to apply" />

							<h:outputText value="Endpoint * " />
							<h:inputTextarea id="createSubscriptionEndpoint" value="#{context.subscriptionEndpoint}" cols="50" rows="2" required="true" requiredMessage="Please enter the rest-hook channel url endpoint" />

							<h:outputText value="Select Payload Type *" />
							<p:selectOneMenu id="createSubscriptionPayloadTypeDropdown" required="true" label="Select Payload (mime-type)" value="#{context.selectedSubscriptionPayloadType}" maxlength="255" style="width:240px;text-align:left;padding-right:30px;">
								<f:selectItems value="#{context.listSubscriptionPayloadTypes}" var="pay" itemLabel="#{pay.label.trim()}         " itemValue="#{pay.key}" />
							</p:selectOneMenu>

							<h:outputText value="Select Payload Content *" />
							<p:selectOneMenu id="createSubscriptionContentTypeDropdown" required="true" label="Select Payload Content" value="#{context.selectedSubscriptionContentType}" maxlength="255" style="width:240px;text-align:left;padding-right:30px;">
								<f:selectItems value="#{context.listSubscriptionContentTypes}" var="con" itemLabel="#{con.label.trim()}         " itemValue="#{con.key}" />
							</p:selectOneMenu>

							<h:outputText value="End Date (Optional)" />
							<p:datePicker id="createSubscriptionEndDate" value="#{context.endDate}" showButtonBar="true" />

							<h:outputText id="heartbeat" value="Heartbeat secs (Optional) " />
							<p:inputNumber id="createSubscriptionHeartbeat" value="#{context.subscriptionHeartbeat}" decimalPlaces="0" roundMethod="S" minValue="0" size="10" />

							<h:outputText id="timeout" value="Timeout secs (Optional) " />
							<p:inputNumber id="createSubscriptionTimeout" value="#{context.subscriptionTimeout}" decimalPlaces="0" roundMethod="S" minValue="0" size="10" />

							<h:outputText id="maxcount" value="Max Count (Optional) " />
							<p:inputNumber id="createSubscriptionMaxCount" value="#{context.subscriptionMaxCount}" decimalPlaces="0" roundMethod="S" minValue="1" size="10" />

							<p:tooltip id="toolTipheartbeat" for="heartbeat" value="Please enter the interval in seconds to send a 'heartbeat' notification" position="top" />
							<p:tooltip id="toolTiptimeout" for="timeout" value="Please enter the interval in seconds to attempt notification delivery" position="top" />
							<p:tooltip id="toolTipmaxcount" for="maxcount" value="Please enter the maximum number of triggering resources included in notification bundles" position="top" />
						</p:panelGrid>
					</p:tab>

					<p:tab title="Request" id="createSubscriptionTab1">
						<h:inputTextarea value="#{context.resourceString}" cols="80" rows="24" />
					</p:tab>

					<p:tab title="Results" id="createSubscriptionResultsTab">
						<h:outputText id="lblcreateSubscriptionResults" escape="true"
							value="#{context.responseString}"
							styleClass="whiteSpaceClass" />
					</p:tab>
				</p:tabView>
			</p:panel>
		</h:form>
	</p:tab>

</ui:composition>
